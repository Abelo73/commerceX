spring:
  application:
    name: commercex
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/commercex}
    username: ${DB_USERNAME:commercex}
    password: ${DB_PASSWORD:commercex}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6389}
      timeout: 500ms
      connect-timeout: 500ms
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down: the outbox relay retries with backoff.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  cache:
    type: redis
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Honour X-Forwarded-For/-Proto only from internal proxies (Tomcat's default trusted ranges), e.g. the
  # Next.js server that proxies /api. Client IPs then feed rate limits and audit logs correctly.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

commercex:
  security:
    jwt:
      issuer: ${JWT_ISSUER:commercex}
      access-token-ttl: 15m
      # PEM keys, required in prod. Set via env, e.g.
      #   COMMERCEX_SECURITY_JWT_PRIVATEKEYLOCATION=file:/run/secrets/jwt-private.pem
      #   COMMERCEX_SECURITY_JWT_PUBLICKEYLOCATION=file:/run/secrets/jwt-public.pem
      allow-ephemeral-keys: false
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    refresh-token-ttl: 30d
    password-reset-ttl: 30m
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    refresh-cookie:
      name: cx_refresh
      path: /api/v1/auth
      secure: true
      same-site: Strict
    rate-limits:
      login-per-ip: { capacity: 30, period: 1m }
      login-per-email: { capacity: 10, period: 15m }
      register-per-ip: { capacity: 10, period: 1h }
      password-reset-per-ip: { capacity: 10, period: 1h }
      password-reset-per-email: { capacity: 3, period: 1h }
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  catalog:
    currency: ${STORE_CURRENCY:USD}
  cart:
    guest-ttl: 30d
    max-lines: 50
    guest-creations-per-ip: { capacity: 30, period: 1h }
  orders:
    payment-window: 30m
  checkout:
    shipping-methods:
      - { code: STANDARD, name: Standard, price-minor: 599, free-over-minor: 10000, min-days: 3, max-days: 5 }
      - { code: EXPRESS, name: Express, price-minor: 1499, min-days: 1, max-days: 2 }
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    signature-tolerance: 5m
    reconcile-after: 2m
  rate-limit:
    store: ${RATE_LIMIT_STORE:redis}
  outbox:
    poll-interval-ms: 1000
    retention: 7d
  notification:
    from: ${MAIL_FROM:no-reply@commercex.local}
    operations-email: ${OPERATIONS_EMAIL:ops@commercex.local}
